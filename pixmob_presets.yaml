alias: PixMob
icon: mdi:led-strip-variant
description: Comanda i braccialetti PixMob via IR (Broadlink)
mode: single
fields:
  color:
    name: Color
    default: Red
    required: true
    selector:
      select:
        options:
          - Red
          - Orange
          - Yellow
          - Yellow-green
          - Light green
          - Green
          - Turquoise
          - Light blue
          - Blue
          - Magenta
          - Pink
          - Whitish
  effect:
    name: Effect
    default: Flash
    required: true
    selector:
      select:
        options:
          - Flash
          - Fade in 2.4s
          - In 480ms / out 960ms
          - In 2.4s / out 960ms
          - Fade out 3.84s
          - In 2.4s / out 480ms
          - In 480ms / out 480ms
  repeats:
    name: Repeats
    default: 1
    selector:
      number:
        min: 1
        max: 10
        mode: box
sequence:
  - action: remote.send_command
